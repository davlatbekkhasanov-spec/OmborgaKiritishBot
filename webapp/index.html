<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>QR skaner · Ombor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1419;
      color: #e8eef4;
      min-height: 100vh;
    }
    .head {
      padding: 16px 16px 8px;
      text-align: center;
      border-bottom: 1px solid #243044;
    }
    .head h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .head p { margin: 8px 0 0; font-size: 13px; color: #8fa3b8; }
    #reader { width: 100%; max-width: 480px; margin: 12px auto; }
    #reader video { border-radius: 12px; }
    .hint {
      padding: 12px 16px 24px;
      font-size: 13px;
      color: #8fa3b8;
      text-align: center;
      line-height: 1.5;
    }
    .brand { color: #5eead4; font-weight: 600; }
  </style>
</head>
<body>
  <div class="head">
    <h1>📷 QR skaner</h1>
    <p><span class="brand">GLOBUS · OMBOR</span> — zonadagi kodni skaner qiling</p>
  </div>
  <div id="reader"></div>
  <p class="hint">Avval guruhda <b>Reys oldim</b> bosing.<br />Keyin zonadagi QR ni kameraga tuting.</p>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#0f1419");
    tg.setBackgroundColor("#0f1419");

    function parseZone(text) {
      const raw = String(text || "").trim();
      let m = raw.match(/start=zone_([A-Za-z0-9_]+)/i);
      if (m) return m[1].toUpperCase();
      m = raw.match(/zone_([A-Za-z0-9_]+)/i);
      if (m) return m[1].toUpperCase();
      if (/^[A-Z0-9_]+$/.test(raw) && raw.length < 32) return raw;
      return null;
    }

    let done = false;
    const scanner = new Html5QrcodeScanner(
      "reader",
      { fps: 12, qrbox: { width: 260, height: 260 }, aspectRatio: 1 },
      false
    );

    scanner.render(
      function onSuccess(decodedText) {
        if (done) return;
        const zone = parseZone(decodedText);
        if (!zone) {
          tg.showAlert("Bu QR ombor zonasi emas.");
          return;
        }
        done = true;
        tg.sendData(JSON.stringify({ zone: zone }));
        scanner.clear().then(function () {
          tg.close();
        }).catch(function () {
          tg.close();
        });
      },
      function onError() {}
    );
  </script>
</body>
</html>
