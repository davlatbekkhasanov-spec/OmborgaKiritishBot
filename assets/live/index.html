<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GLOBUS · OMBOR LIVE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #eef4fb 0%, #f8fbff 100%);
      color: #0f172a;
      min-height: 100vh;
      padding: 16px;
    }
    .top {
      max-width: 920px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #003f8f;
    }
    .meta {
      font-size: 14px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #dc2626;
    }
    .pulse::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #dc2626;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 50% { opacity: 0.35; } }
    .grid {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .empty {
      text-align: center;
      padding: 48px 20px;
      border: 2px dashed #b8cfe6;
      border-radius: 16px;
      background: #fff;
      color: #64748b;
    }
    .card {
      background: #fff;
      border: 2px solid #b8cfe6;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 63, 143, 0.08);
    }
    .card-head {
      background: linear-gradient(135deg, #003f8f 0%, #0b5cb8 100%);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .card-head h2 { font-size: 20px; font-weight: 800; }
    .card-head .sid { font-size: 13px; opacity: 0.9; }
    .card-body { padding: 16px 18px 18px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat {
      border: 1px solid #d7e1ef;
      border-radius: 12px;
      padding: 12px 14px;
      background: #f8fbff;
    }
    .stat .lbl { font-size: 13px; font-weight: 700; color: #003f8f; margin-bottom: 6px; }
    .stat .val { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #0b5cb8, #17a2b8);
      border-radius: 999px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      color: #003f8f;
      margin: 14px 0 8px;
    }
    .list {
      border: 1px solid #d7e1ef;
      border-radius: 12px;
      overflow: hidden;
    }
    .list-row {
      padding: 10px 14px;
      border-bottom: 1px solid #e8eef5;
      font-size: 15px;
      line-height: 1.45;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:nth-child(even) { background: #f8fbff; }
    .badge-open {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
    }
    .err { color: #b91c1c; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">📦 GLOBUS · OMBOR LIVE</div>
    <div class="meta">
      <span class="pulse">LIVE</span>
      <span id="clock">—</span>
      <span id="count">—</span>
    </div>
  </div>
  <div class="grid" id="root">
    <div class="empty">Yuklanmoqda…</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function bar(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      return `<div class="bar"><i style="width:${p}%"></i></div>`;
    }

    function renderWorker(w) {
      const trips = (w.trips || []).map((t, i) =>
        `<div class="list-row">${i+1}. <b>${esc(t.zone_name)}</b> · ${t.leg_meter}m · ⏱ ${esc(t.duration)}</div>`
      ).join("") || `<div class="list-row"><i>Reys yo'q</i></div>`;

      const empty = (w.empty_segments || []).map((s, i) =>
        `<div class="list-row">${i+1}. ${esc(s.from_zone_name || s.from_zone)} → yuk olish · <b>${s.meter}m</b></div>`
      ).join("");

      const open = w.open_trip ? `<span class="badge-open">🚛 Reysda</span>` : "";

      return `
        <article class="card">
          <div class="card-head">
            <h2>👤 ${esc(w.full_name)} ${open}</h2>
            <span class="sid">#${esc(w.session_id)}</span>
          </div>
          <div class="card-body">
            <div class="stats">
              <div class="stat"><div class="lbl">⏱ Ish vaqti</div><div class="val">${esc(w.ish_vaqti)}</div></div>
              <div class="stat"><div class="lbl">📦 Reyslar</div><div class="val">${w.reys_count}</div>${bar(w.reys_bar_pct)}</div>
              <div class="stat"><div class="lbl">📏 Yuk bilan</div><div class="val">${w.yuk_masofa}m</div></div>
              <div class="stat"><div class="lbl">🚶 Yuksiz</div><div class="val">${w.yuksiz_masofa}m</div></div>
              <div class="stat"><div class="lbl">☕ Dam</div><div class="val">${esc(w.dam)}</div></div>
            </div>
            <div class="section-title">📦 REYSLAR (yuk bilan)</div>
            <div class="list">${trips}</div>
            ${empty ? `<div class="section-title">🚶 YUKSIZ YURISH</div><div class="list">${empty}</div>` : ""}
          </div>
        </article>`;
    }

    async function load() {
      const root = document.getElementById("root");
      try {
        const r = await fetch("/live/api?token=" + encodeURIComponent(token), { cache: "no-store" });
        if (!r.ok) throw new Error("API " + r.status);
        const data = await r.json();
        document.getElementById("clock").textContent = data.display_time || "—";
        document.getElementById("count").textContent =
          data.active_count ? `${data.active_count} kishi · ${data.total_trips} reys` : "Aktiv yo'q";
        if (!data.workers || !data.workers.length) {
          root.innerHTML = `<div class="empty">Hozircha aktiv ishchi yo'q.<br/>Ishchi botda <b>Boshlash</b> bosganda shu yerda ko'rinadi.</div>`;
          return;
        }
        root.innerHTML = data.workers.map(renderWorker).join("");
      } catch (e) {
        root.innerHTML = `<div class="err">Xatolik: ${esc(e.message)}</div>`;
      }
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
