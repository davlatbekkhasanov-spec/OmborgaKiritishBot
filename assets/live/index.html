<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GLOBUS · OMBOR LIVE</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #003f8f;
      --brand-2: #0b5cb8;
      --brand-soft: #e8f1fb;
      --live: #dc2626;
      --ok: #059669;
      --done: #4f46e5;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #002d66 0%, var(--brand) 55%, var(--brand-2) 100%);
      color: #fff;
      padding: 18px 20px 20px;
      box-shadow: 0 2px 16px rgba(0, 63, 143, 0.25);
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 20px;
    }
    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .brand-text span {
      font-size: 12px;
      opacity: 0.75;
      font-weight: 500;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .live-pill.off {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .live-pill::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 1.4s ease infinite;
    }
    .live-pill.off::before {
      background: #94a3b8;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .clock {
      opacity: 0.9;
      font-variant-numeric: tabular-nums;
    }

    /* ── KPI row ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 640px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .kpi .lbl {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      opacity: 0.75;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .kpi .val {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    /* ── Main ── */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty, .err {
      text-align: center;
      padding: 56px 24px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--muted);
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty h3 { color: var(--ink); font-size: 17px; margin-bottom: 8px; }
    .empty p { font-size: 14px; line-height: 1.6; }
    .err { color: #b91c1c; }

    /* ── Worker card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--line);
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .card.done { border-color: #c7d2fe; }

    .card-head {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #f8fbff 0%, #fff 100%);
    }
    .card.done .card-head {
      background: linear-gradient(180deg, #f5f3ff 0%, #fff 100%);
    }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      display: grid; place-items: center;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .card.done .avatar {
      background: linear-gradient(135deg, #4338ca, #6366f1);
    }
    .card-title { flex: 1; min-width: 0; }
    .card-title h2 {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .badge-live { background: #dcfce7; color: #166534; }
    .badge-trip { background: #fef3c7; color: #92400e; }
    .badge-done { background: #e0e7ff; color: #3730a3; }
    .session-id {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 8px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .card-body { padding: 16px 18px 18px; }

    /* ── Stats grid ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stats .stat:last-child { grid-column: span 2; }
    }
    .stat {
      background: var(--brand-soft);
      border: 1px solid #d0e3f7;
      border-radius: var(--radius-sm);
      padding: 12px;
    }
    .stat .lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .stat .val {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .bar {
      height: 4px;
      background: rgba(0,63,143,0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--brand), #17a2b8);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* ── Tables ── */
    .section {
      margin-top: 4px;
    }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 8px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--brand);
    }
    .section-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .tbl thead th {
      background: #f1f5f9;
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .tbl thead th.num { width: 36px; text-align: center; }
    .tbl thead th.r { text-align: right; }
    .tbl tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:nth-child(even) { background: #fafcff; }
    .tbl .num { text-align: center; color: var(--muted); font-weight: 600; font-size: 13px; }
    .tbl .zone { font-weight: 600; }
    .tbl .r { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .tbl .muted { color: var(--muted); font-weight: 500; }
    .tbl-empty td {
      text-align: center;
      color: var(--muted);
      font-style: italic;
      padding: 16px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">📦</div>
          <div class="brand-text">
            <h1>GLOBUS · OMBOR</h1>
            <span>Real vaqt monitoring paneli</span>
          </div>
        </div>
        <div class="header-meta">
          <span class="live-pill off" id="livePill">LIVE</span>
          <span class="clock" id="clock">—</span>
        </div>
      </div>
      <div class="kpi-row" id="kpiRow">
        <div class="kpi"><div class="lbl">Aktiv</div><div class="val" id="kpiActive">—</div></div>
        <div class="kpi"><div class="lbl">Yakunlangan</div><div class="val" id="kpiDone">—</div></div>
        <div class="kpi"><div class="lbl">Reyslar</div><div class="val" id="kpiTrips">—</div></div>
        <div class="kpi"><div class="lbl">Masofa</div><div class="val" id="kpiDist">—</div></div>
      </div>
    </div>
  </header>

  <main class="main" id="root">
    <div class="empty"><div class="empty-icon">⏳</div><h3>Yuklanmoqda…</h3></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function initials(name) {
      const parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function fmtDist(m) {
      const n = Math.max(0, Number(m) || 0);
      if (n >= 1000) return (n / 1000).toFixed(1) + " km";
      return n + " m";
    }

    function fmtFinished(iso) {
      if (!iso) return "";
      const s = iso.replace("T", " ");
      const [date, time] = s.split(" ");
      if (!date || !time) return s.slice(0, 16);
      const [y, mo, d] = date.split("-");
      return `${time.slice(0, 5)} · ${d}.${mo}.${y}`;
    }

    function bar(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      return `<div class="bar"><i style="width:${p}%"></i></div>`;
    }

    function tripTable(trips) {
      if (!trips || !trips.length) {
        return `<table class="tbl"><tbody><tr class="tbl-empty"><td colspan="4">Reys yo'q</td></tr></tbody></table>`;
      }
      const rows = trips.map((t, i) => `
        <tr>
          <td class="num">${i + 1}</td>
          <td class="zone">${esc(t.zone_name)}</td>
          <td class="r">${fmtDist(t.leg_meter)}</td>
          <td class="r muted">${esc(t.duration)}</td>
        </tr>`).join("");
      return `<table class="tbl">
        <thead><tr>
          <th class="num">#</th>
          <th>Zona</th>
          <th class="r">Masofa</th>
          <th class="r">Vaqt</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function emptyTable(segments) {
      if (!segments || !segments.length) return "";
      const rows = segments.map((s, i) => `
        <tr>
          <td class="num">${i + 1}</td>
          <td class="zone">${esc(s.from_zone_name || s.from_zone)} <span class="muted">→ yuk olish</span></td>
          <td class="r">${fmtDist(s.meter)}</td>
        </tr>`).join("");
      return `
        <div class="section">
          <div class="section-head">🚶 Yuksiz yurish</div>
          <table class="tbl">
            <thead><tr>
              <th class="num">#</th>
              <th>Marshrut</th>
              <th class="r">Masofa</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function renderWorker(w) {
      const isActive = w.status === "active";
      const badges = [];
      if (isActive) badges.push(`<span class="badge badge-live">● Aktiv</span>`);
      if (w.open_trip) badges.push(`<span class="badge badge-trip">🚛 Reysda</span>`);
      if (!isActive) badges.push(`<span class="badge badge-done">✓ Yakunlangan</span>`);

      const sub = !isActive && w.finished_at
        ? `Yakunlandi: ${fmtFinished(w.finished_at)}`
        : isActive ? "Jarayonda" : "";

      return `
        <article class="card${isActive ? "" : " done"}">
          <div class="card-head">
            <div class="avatar">${esc(initials(w.full_name))}</div>
            <div class="card-title">
              <h2>${esc(w.full_name)}</h2>
              ${sub ? `<div class="card-sub">${esc(sub)}</div>` : ""}
              <div class="card-badges">${badges.join("")}</div>
            </div>
            <div class="session-id">#${esc(w.session_id)}</div>
          </div>
          <div class="card-body">
            <div class="stats">
              <div class="stat">
                <div class="lbl">Ish vaqti</div>
                <div class="val">${esc(w.ish_vaqti)}</div>
              </div>
              <div class="stat">
                <div class="lbl">Reyslar</div>
                <div class="val">${w.reys_count}</div>
                ${bar(w.reys_bar_pct)}
              </div>
              <div class="stat">
                <div class="lbl">Yuk bilan</div>
                <div class="val">${fmtDist(w.yuk_masofa)}</div>
              </div>
              <div class="stat">
                <div class="lbl">Yuksiz</div>
                <div class="val">${fmtDist(w.yuksiz_masofa)}</div>
              </div>
              <div class="stat">
                <div class="lbl">Dam</div>
                <div class="val">${esc(w.dam)}</div>
              </div>
            </div>
            <div class="section">
              <div class="section-head">📦 Reyslar (yuk bilan)</div>
              ${tripTable(w.trips)}
            </div>
            ${emptyTable(w.empty_segments)}
          </div>
        </article>`;
    }

    function updateKpi(data) {
      document.getElementById("kpiActive").textContent = data.active_count ?? 0;
      document.getElementById("kpiDone").textContent = data.finished_count ?? 0;
      document.getElementById("kpiTrips").textContent = data.total_trips ?? 0;
      document.getElementById("kpiDist").textContent = fmtDist(data.total_distance ?? 0);

      const pill = document.getElementById("livePill");
      if (data.active_count > 0) {
        pill.classList.remove("off");
      } else {
        pill.classList.add("off");
      }
    }

    async function load() {
      const root = document.getElementById("root");
      try {
        const r = await fetch("/live/api?token=" + encodeURIComponent(token), { cache: "no-store" });
        if (!r.ok) throw new Error("API " + r.status);
        const data = await r.json();

        document.getElementById("clock").textContent = data.display_time || "—";
        updateKpi(data);

        if (!data.workers || !data.workers.length) {
          root.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📭</div>
              <h3>Hozircha ma'lumot yo'q</h3>
              <p>Ishchi botda <b>Boshlash</b> bosganda shu yerda ko'rinadi.<br/>
              Yakunlangan sessiyalar bugun oxirigacha saqlanadi.</p>
            </div>`;
          return;
        }
        root.innerHTML = data.workers.map(renderWorker).join("");
      } catch (e) {
        root.innerHTML = `<div class="err">Xatolik: ${esc(e.message)}</div>`;
      }
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
