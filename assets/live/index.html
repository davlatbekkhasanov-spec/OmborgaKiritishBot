<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GLOBUS · OMBOR LIVE</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #003f8f;
      --brand-2: #0b5cb8;
      --brand-soft: #e8f1fb;
      --live: #dc2626;
      --done: #4f46e5;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      --radius: 14px;
      --radius-sm: 10px;
      --done-scroll-h: min(52vh, 420px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, #002d66 0%, var(--brand) 55%, var(--brand-2) 100%);
      color: #fff;
      padding: 18px 20px 20px;
      box-shadow: 0 2px 16px rgba(0, 63, 143, 0.25);
    }
    .header-inner { max-width: 960px; margin: 0 auto; }
    .header-top {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px; margin-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 40px; height: 40px; background: rgba(255,255,255,0.15);
      border-radius: 10px; display: grid; place-items: center; font-size: 20px;
    }
    .brand-text h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.2; }
    .brand-text span { font-size: 12px; opacity: 0.75; font-weight: 500; }
    .header-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(220,38,38,0.2); border: 1px solid rgba(255,255,255,0.25);
      padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: 0.06em;
    }
    .live-pill.off { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
    .live-pill::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--live); animation: pulse 1.4s ease infinite;
    }
    .live-pill.off::before { background: #94a3b8; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .clock { opacity: 0.9; font-variant-numeric: tabular-nums; }

    .kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    @media (max-width:640px) { .kpi-row { grid-template-columns: repeat(2,1fr); } }
    .kpi {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-sm); padding: 12px 14px;
    }
    .kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.75; margin-bottom: 4px; font-weight: 600; }
    .kpi .val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }

    .main {
      max-width: 960px; margin: 0 auto; padding: 20px 16px 32px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .empty, .err {
      text-align: center; padding: 56px 24px; background: var(--surface);
      border-radius: var(--radius); box-shadow: var(--shadow); color: var(--muted);
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty h3 { color: var(--ink); font-size: 17px; margin-bottom: 8px; }
    .err { color: #b91c1c; }

    .block-title {
      font-size: 12px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .block-title .cnt {
      background: var(--surface); border: 1px solid var(--line);
      padding: 2px 8px; border-radius: 999px; font-size: 11px; color: var(--ink);
    }

    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line);
      contain: layout style;
    }
    .card.done { border-color: #c7d2fe; }

    .card-head {
      padding: 16px 18px; display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #f8fbff 0%, #fff 100%);
    }
    .card.done .card-head { background: linear-gradient(180deg, #f5f3ff 0%, #fff 100%); }
    .avatar {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff; font-weight: 800; font-size: 15px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .card.done .avatar { background: linear-gradient(135deg, #4338ca, #6366f1); }
    .card-title { flex: 1; min-width: 0; }
    .card-title h2 { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .badge {
      display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 999px;
    }
    .badge-live { background: #dcfce7; color: #166534; }
    .badge-trip { background: #fef3c7; color: #92400e; }
    .badge-done { background: #e0e7ff; color: #3730a3; }
    .session-id {
      font-size: 12px; font-weight: 700; color: var(--muted); background: var(--bg);
      padding: 6px 10px; border-radius: 8px; flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .card-body { padding: 16px 18px 18px; }

    .stats {
      display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 18px;
    }
    @media (max-width:720px) {
      .stats { grid-template-columns: repeat(2,1fr); }
      .stats .stat:last-child { grid-column: span 2; }
    }
    .stat {
      background: var(--brand-soft); border: 1px solid #d0e3f7;
      border-radius: var(--radius-sm); padding: 12px;
    }
    .stat .lbl { font-size: 11px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .stat .val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .bar { height: 4px; background: rgba(0,63,143,0.12); border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #17a2b8); border-radius: 999px; transition: width 0.6s ease; }

    .section-head {
      display: flex; align-items: center; gap: 8px; margin: 16px 0 8px;
      font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--brand);
    }
    .section-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .tbl-wrap {
      max-height: 220px; overflow: auto; border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      -webkit-overflow-scrolling: touch;
    }
    .tbl-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
    .tbl-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl thead th {
      position: sticky; top: 0; z-index: 1;
      background: #f1f5f9; text-align: left; padding: 8px 12px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); border-bottom: 1px solid var(--line);
    }
    .tbl thead th.num { width: 36px; text-align: center; }
    .tbl thead th.r { text-align: right; }
    .tbl tbody td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:nth-child(even) { background: #fafcff; }
    .tbl .num { text-align: center; color: var(--muted); font-weight: 600; font-size: 13px; }
    .tbl .zone { font-weight: 600; }
    .tbl .r { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .tbl .muted { color: var(--muted); font-weight: 500; }
    .tbl-empty td { text-align: center; color: var(--muted); font-style: italic; padding: 16px; }

    /* ── Yakunlangan panel ── */
    .done-panel {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden;
    }
    .done-panel-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 14px 16px; background: #f8fafc; border-bottom: 1px solid var(--line);
    }
    .done-panel-head h3 {
      font-size: 14px; font-weight: 800; flex: 1; min-width: 120px;
      display: flex; align-items: center; gap: 8px;
    }
    .done-panel-head h3 .n {
      background: #e0e7ff; color: #3730a3; font-size: 12px;
      padding: 2px 8px; border-radius: 999px;
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar input {
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
      font-size: 13px; min-width: 140px; outline: none;
    }
    .toolbar input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 2px rgba(11,92,184,0.15); }
    .toolbar select {
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
      font-size: 13px; background: #fff;
    }
    .pager {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; border-top: 1px solid var(--line); background: #fafbfc;
      font-size: 13px;
    }
    .pager button {
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .pager button:disabled { opacity: 0.4; cursor: default; }
    .pager button:not(:disabled):hover { border-color: var(--brand-2); color: var(--brand); }
    .pager .info { color: var(--muted); font-variant-numeric: tabular-nums; }

    .done-scroll {
      max-height: var(--done-scroll-h); overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .done-scroll::-webkit-scrollbar { width: 8px; }
    .done-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

    .done-row { border-bottom: 1px solid var(--line); }
    .done-row:last-child { border-bottom: none; }
    .done-row-main {
      display: grid; grid-template-columns: 36px 1fr auto 28px;
      gap: 10px; align-items: center; padding: 12px 16px;
      cursor: pointer; user-select: none; transition: background 0.15s;
    }
    .done-row-main:hover { background: #f8fbff; }
    .done-row.open .done-row-main { background: #f5f3ff; }
    .done-row .av-sm {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #4338ca, #6366f1);
      color: #fff; font-weight: 800; font-size: 12px;
      display: grid; place-items: center;
    }
    .done-row .nm { font-weight: 700; font-size: 14px; }
    .done-row .sm { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .done-row .tm { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .done-row .chev { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
    .done-row.open .chev { transform: rotate(90deg); }
    .done-detail {
      display: none; padding: 0 16px 16px; border-top: 1px dashed var(--line);
      background: #fafbff;
    }
    .done-row.open .done-detail { display: block; }

    #sec-active { display: flex; flex-direction: column; gap: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">📦</div>
          <div class="brand-text">
            <h1>GLOBUS · OMBOR</h1>
            <span>Real vaqt monitoring paneli</span>
          </div>
        </div>
        <div class="header-meta">
          <span class="live-pill off" id="livePill">LIVE</span>
          <span class="clock" id="clock">—</span>
        </div>
      </div>
      <div class="kpi-row">
        <div class="kpi"><div class="lbl">Aktiv</div><div class="val" id="kpiActive">—</div></div>
        <div class="kpi"><div class="lbl">Yakunlangan</div><div class="val" id="kpiDone">—</div></div>
        <div class="kpi"><div class="lbl">Reyslar</div><div class="val" id="kpiTrips">—</div></div>
        <div class="kpi"><div class="lbl">Masofa</div><div class="val" id="kpiDist">—</div></div>
      </div>
    </div>
  </header>

  <main class="main" id="root">
    <div class="empty" id="loading"><div class="empty-icon">⏳</div><h3>Yuklanmoqda…</h3></div>
    <div id="content" class="hidden">
      <div id="sec-active-wrap">
        <div class="block-title">● Aktiv ishchilar <span class="cnt" id="activeCnt">0</span></div>
        <div id="sec-active"></div>
        <div class="empty hidden" id="no-active"><div class="empty-icon">💤</div><h3>Hozircha aktiv yo'q</h3></div>
      </div>
      <div class="done-panel hidden" id="done-panel">
        <div class="done-panel-head">
          <h3>✓ Yakunlangan <span class="n" id="doneCnt">0</span></h3>
          <div class="toolbar">
            <input type="search" id="doneSearch" placeholder="Ism bo'yicha qidirish…" autocomplete="off"/>
            <select id="donePageSize" title="Sahifada">
              <option value="10">10 ta</option>
              <option value="20" selected>20 ta</option>
              <option value="50">50 ta</option>
            </select>
          </div>
        </div>
        <div class="done-scroll" id="done-scroll"></div>
        <div class="pager hidden" id="done-pager">
          <button type="button" id="pgPrev">← Oldingi</button>
          <span class="info" id="pgInfo">—</span>
          <button type="button" id="pgNext">Keyingi →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get("token") || "";

    const state = {
      donePage: 1,
      expanded: new Set(),
      doneWorkers: [],
      activeWorkers: [],
      scrollDone: 0,
    };

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function initials(name) {
      const p = String(name || "?").trim().split(/\s+/).filter(Boolean);
      if (!p.length) return "?";
      if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
      return (p[0][0] + p[1][0]).toUpperCase();
    }
    function fmtDist(m) {
      const n = Math.max(0, Number(m) || 0);
      return n >= 1000 ? (n / 1000).toFixed(1) + " km" : n + " m";
    }
    function fmtFinished(iso) {
      if (!iso) return "—";
      const s = iso.replace("T", " ");
      const [date, time] = s.split(" ");
      if (!date || !time) return s.slice(0, 16);
      const [y, mo, d] = date.split("-");
      return `${time.slice(0, 5)} · ${d}.${mo}.${y}`;
    }
    function fmtTimeShort(iso) {
      if (!iso) return "—";
      const t = iso.replace("T", " ").split(" ")[1];
      return t ? t.slice(0, 5) : "—";
    }
    function setText(el, v) { if (el && el.textContent !== v) el.textContent = v; }

    function tripTable(trips) {
      if (!trips || !trips.length) {
        return `<div class="tbl-wrap"><table class="tbl"><tbody><tr class="tbl-empty"><td colspan="4">Reys yo'q</td></tr></tbody></table></div>`;
      }
      const rows = trips.map((t, i) => `
        <tr><td class="num">${i+1}</td><td class="zone">${esc(t.zone_name)}</td>
        <td class="r">${fmtDist(t.leg_meter)}</td><td class="r muted">${esc(t.duration)}</td></tr>`).join("");
      return `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="num">#</th><th>Zona</th><th class="r">Masofa</th><th class="r">Vaqt</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }
    function emptyTable(segments) {
      if (!segments || !segments.length) return "";
      const rows = segments.map((s, i) => `
        <tr><td class="num">${i+1}</td>
        <td class="zone">${esc(s.from_zone_name || s.from_zone)} <span class="muted">→ yuk olish</span></td>
        <td class="r">${fmtDist(s.meter)}</td></tr>`).join("");
      return `<div class="section-head">🚶 Yuksiz yurish</div>
        <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="num">#</th><th>Marshrut</th><th class="r">Masofa</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }
    function detailBody(w) {
      return `
        <div class="stats" style="margin-top:12px">
          <div class="stat"><div class="lbl">Ish vaqti</div><div class="val">${esc(w.ish_vaqti)}</div></div>
          <div class="stat"><div class="lbl">Reyslar</div><div class="val">${w.reys_count}</div></div>
          <div class="stat"><div class="lbl">Yuk bilan</div><div class="val">${fmtDist(w.yuk_masofa)}</div></div>
          <div class="stat"><div class="lbl">Yuksiz</div><div class="val">${fmtDist(w.yuksiz_masofa)}</div></div>
          <div class="stat"><div class="lbl">Dam</div><div class="val">${esc(w.dam)}</div></div>
        </div>
        <div class="section-head">📦 Reyslar (yuk bilan)</div>
        ${tripTable(w.trips)}
        ${emptyTable(w.empty_segments)}`;
    }

    function activeCardHtml(w) {
      const badges = [`<span class="badge badge-live">● Aktiv</span>`];
      if (w.open_trip) badges.push(`<span class="badge badge-trip">🚛 Reysda</span>`);
      return `
        <div class="card-head">
          <div class="avatar">${esc(initials(w.full_name))}</div>
          <div class="card-title">
            <h2>${esc(w.full_name)}</h2>
            <div class="card-sub">Jarayonda</div>
            <div class="card-badges" data-f="badges">${badges.join("")}</div>
          </div>
          <div class="session-id">#${esc(w.session_id)}</div>
        </div>
        <div class="card-body">
          <div class="stats">
            <div class="stat"><div class="lbl">Ish vaqti</div><div class="val" data-f="ish">${esc(w.ish_vaqti)}</div></div>
            <div class="stat"><div class="lbl">Reyslar</div><div class="val" data-f="reys">${w.reys_count}</div>
              <div class="bar" data-f="bar"><i style="width:${Math.min(100, w.reys_bar_pct||0)}%"></i></div></div>
            <div class="stat"><div class="lbl">Yuk bilan</div><div class="val" data-f="yuk">${fmtDist(w.yuk_masofa)}</div></div>
            <div class="stat"><div class="lbl">Yuksiz</div><div class="val" data-f="yuksiz">${fmtDist(w.yuksiz_masofa)}</div></div>
            <div class="stat"><div class="lbl">Dam</div><div class="val" data-f="dam">${esc(w.dam)}</div></div>
          </div>
          <div class="section-head">📦 Reyslar (yuk bilan)</div>
          <div data-f="trips">${tripTable(w.trips)}</div>
          <div data-f="empty">${emptyTable(w.empty_segments)}</div>
        </div>`;
    }

    function patchActiveCard(el, w) {
      setText(el.querySelector('[data-f="ish"]'), w.ish_vaqti);
      setText(el.querySelector('[data-f="reys"]'), String(w.reys_count));
      setText(el.querySelector('[data-f="yuk"]'), fmtDist(w.yuk_masofa));
      setText(el.querySelector('[data-f="yuksiz"]'), fmtDist(w.yuksiz_masofa));
      setText(el.querySelector('[data-f="dam"]'), w.dam);
      const bar = el.querySelector('[data-f="bar"] > i');
      if (bar) bar.style.width = Math.min(100, w.reys_bar_pct || 0) + "%";
      const badges = el.querySelector('[data-f="badges"]');
      if (badges) {
        const html = [`<span class="badge badge-live">● Aktiv</span>`];
        if (w.open_trip) html.push(`<span class="badge badge-trip">🚛 Reysda</span>`);
        const next = html.join("");
        if (badges.innerHTML !== next) badges.innerHTML = next;
      }
      const tripsEl = el.querySelector('[data-f="trips"]');
      const tripsHtml = tripTable(w.trips);
      if (tripsEl && tripsEl.dataset.sig !== String(w.reys_count)) {
        tripsEl.innerHTML = tripsHtml;
        tripsEl.dataset.sig = String(w.reys_count);
      }
      const emptyEl = el.querySelector('[data-f="empty"]');
      const emptyHtml = emptyTable(w.empty_segments);
      const emptySig = String((w.empty_segments || []).length);
      if (emptyEl && emptyEl.dataset.sig !== emptySig) {
        emptyEl.innerHTML = emptyHtml;
        emptyEl.dataset.sig = emptySig;
      }
    }

    function syncActive(workers) {
      const box = document.getElementById("sec-active");
      const ids = new Set(workers.map(w => String(w.session_id)));
      box.querySelectorAll("[data-sid]").forEach(el => {
        if (!ids.has(el.dataset.sid)) el.remove();
      });

      workers.forEach((w, i) => {
        const sid = String(w.session_id);
        let el = box.querySelector(`[data-sid="${sid}"]`);
        if (!el) {
          el = document.createElement("article");
          el.className = "card";
          el.dataset.sid = sid;
          el.innerHTML = activeCardHtml(w);
          const ref = box.children[i];
          if (ref) box.insertBefore(el, ref);
          else box.appendChild(el);
        } else {
          patchActiveCard(el, w);
          if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
        }
      });

      document.getElementById("activeCnt").textContent = String(workers.length);
      document.getElementById("no-active").classList.toggle("hidden", workers.length > 0);
    }

    function filteredDone() {
      const q = (document.getElementById("doneSearch").value || "").trim().toLowerCase();
      let list = state.doneWorkers;
      if (q) list = list.filter(w => String(w.full_name || "").toLowerCase().includes(q));
      return list;
    }

    function renderDoneList() {
      const list = filteredDone();
      const pageSize = parseInt(document.getElementById("donePageSize").value, 10) || 20;
      const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
      if (state.donePage > totalPages) state.donePage = totalPages;
      const start = (state.donePage - 1) * pageSize;
      const page = list.slice(start, start + pageSize);

      const scroll = document.getElementById("done-scroll");
      state.scrollDone = scroll.scrollTop;

      scroll.innerHTML = page.map(w => {
        const sid = String(w.session_id);
        const open = state.expanded.has(sid);
        return `
          <div class="done-row${open ? " open" : ""}" data-sid="${sid}">
            <div class="done-row-main" data-action="toggle">
              <div class="av-sm">${esc(initials(w.full_name))}</div>
              <div>
                <div class="nm">${esc(w.full_name)} <span class="muted">#${esc(w.session_id)}</span></div>
                <div class="sm">${w.reys_count} reys · ${fmtDist(w.yuk_masofa)} · ${esc(w.ish_vaqti)}</div>
              </div>
              <div class="tm">${fmtTimeShort(w.finished_at)}</div>
              <div class="chev">▸</div>
            </div>
            <div class="done-detail">${detailBody(w)}</div>
          </div>`;
      }).join("") || `<div class="empty" style="box-shadow:none"><p>Topilmadi</p></div>`;

      scroll.scrollTop = state.scrollDone;

      const pager = document.getElementById("done-pager");
      const showPager = list.length > pageSize;
      pager.classList.toggle("hidden", !showPager);
      if (showPager) {
        document.getElementById("pgInfo").textContent =
          `${start + 1}–${Math.min(start + pageSize, list.length)} / ${list.length}`;
        document.getElementById("pgPrev").disabled = state.donePage <= 1;
        document.getElementById("pgNext").disabled = state.donePage >= totalPages;
      }
    }

    function patchDoneCompact() {
      const list = filteredDone();
      const pageSize = parseInt(document.getElementById("donePageSize").value, 10) || 20;
      const start = (state.donePage - 1) * pageSize;
      const page = list.slice(start, start + pageSize);
      const scroll = document.getElementById("done-scroll");

      page.forEach(w => {
        const el = scroll.querySelector(`.done-row[data-sid="${w.session_id}"]`);
        if (!el || state.expanded.has(String(w.session_id))) return;
        const sm = el.querySelector(".sm");
        setText(sm, `${w.reys_count} reys · ${fmtDist(w.yuk_masofa)} · ${w.ish_vaqti}`);
      });
    }

    function updateKpi(data) {
      setText(document.getElementById("kpiActive"), String(data.active_count ?? 0));
      setText(document.getElementById("kpiDone"), String(data.finished_count ?? 0));
      setText(document.getElementById("kpiTrips"), String(data.total_trips ?? 0));
      setText(document.getElementById("kpiDist"), fmtDist(data.total_distance ?? 0));
      document.getElementById("livePill").classList.toggle("off", !(data.active_count > 0));
    }

    function renderAll(data) {
      document.getElementById("loading").classList.add("hidden");
      const workers = data.workers || [];
      if (!workers.length) {
        document.getElementById("content").classList.add("hidden");
        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("loading").innerHTML =
          `<div class="empty-icon">📭</div><h3>Hozircha ma'lumot yo'q</h3>
           <p style="margin-top:8px;font-size:14px;color:#64748b">Ishchi botda <b>Boshlash</b> bosganda shu yerda ko'rinadi.</p>`;
        return;
      }

      document.getElementById("content").classList.remove("hidden");
      state.activeWorkers = workers.filter(w => w.status === "active");
      state.doneWorkers = workers.filter(w => w.status !== "active");

      syncActive(state.activeWorkers);

      const panel = document.getElementById("done-panel");
      panel.classList.toggle("hidden", !state.doneWorkers.length);
      setText(document.getElementById("doneCnt"), String(state.doneWorkers.length));

      if (state.doneWorkers.length) {
        const listChanged = renderAll._doneSig !== state.doneWorkers.map(w => w.session_id).join(",");
        if (listChanged || renderAll._forceDone) {
          renderDoneList();
          renderAll._doneSig = state.doneWorkers.map(w => w.session_id).join(",");
          renderAll._forceDone = false;
        } else {
          patchDoneCompact();
        }
      }
    }

    let inflight = false;
    let lastClock = "";

    async function load() {
      if (inflight) return;
      inflight = true;
      try {
        const r = await fetch("/live/api?token=" + encodeURIComponent(token), { cache: "no-store" });
        if (!r.ok) throw new Error("API " + r.status);
        const data = await r.json();

        if (data.display_time !== lastClock) {
          setText(document.getElementById("clock"), data.display_time || "—");
          lastClock = data.display_time || "";
        }
        updateKpi(data);
        renderAll(data);
      } catch (e) {
        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("content").classList.add("hidden");
        document.getElementById("loading").innerHTML = `<div class="err">Xatolik: ${esc(e.message)}</div>`;
      } finally {
        inflight = false;
      }
    }

    document.getElementById("done-scroll").addEventListener("click", e => {
      const row = e.target.closest(".done-row-main");
      if (!row) return;
      const wrap = row.closest(".done-row");
      const sid = wrap.dataset.sid;
      if (state.expanded.has(sid)) state.expanded.delete(sid);
      else state.expanded.add(sid);
      wrap.classList.toggle("open");
    });

    document.getElementById("doneSearch").addEventListener("input", () => {
      state.donePage = 1;
      renderDoneList();
    });
    document.getElementById("donePageSize").addEventListener("change", () => {
      state.donePage = 1;
      renderDoneList();
    });
    document.getElementById("pgPrev").addEventListener("click", () => {
      if (state.donePage > 1) { state.donePage--; renderDoneList(); }
    });
    document.getElementById("pgNext").addEventListener("click", () => {
      state.donePage++;
      renderDoneList();
    });

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
